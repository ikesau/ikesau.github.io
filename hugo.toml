baseURL = 'https://ikesau.co'
locale = 'en-ca'
title = 'ikesau.co'

[taxonomies]
  tag = "tags"
[params]
    description = 'The website of Ike Saunders'
    gotosocial_token = 'MZRINTC0Y2MTNTI4NI0ZY2VMLTKZOGQTNWMZODU0NTUYNZCZ'

# Only the hand-rolled Atom feed at /feed.xml; no default RSS anywhere.
[outputs]
  home = ['html', 'atom']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.atom]
    mediaType = "application/atom+xml"
    baseName = "feed"
    isPlainText = true

[frontmatter]
date = [ "date", ":filename" ]

[security]
allowContent = ['^text/html$', '^text/markdown$']